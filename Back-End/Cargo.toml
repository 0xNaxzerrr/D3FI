[package]
name = "D3FI"
version = "0.1.0"
edition = "2021"

[dependencies]
# Framework web
axum = { version = "0.7", features = ["ws"] }              # Alternative: actix-web = "4"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# API Documentation
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Ethereum interaction
ethers = { version = "2.0", features = ["ws", "rustls"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "bigdecimal"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# WebSockets
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
dotenvy = "0.15"  
config = "0.13"
anyhow = "1.0"        # Error handling
thiserror = "1.0"     # Error definition
bigdecimal = { version = "0.4", features = ["serde"] }   # For precise financial calculations
rust_decimal = { version = "1.34", features = ["serde"] }
rand = "0.8"          # For random number generation
hex = "0.4"           # For encoding/decoding hex strings

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"